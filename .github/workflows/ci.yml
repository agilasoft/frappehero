name: CI

on:
  push:
  pull_request:

jobs:
  logic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax and unit tests
        run: |
          python -m compileall -q frappehero
          python -m unittest discover -s frappehero -p "test_*.py"
          find frappehero -name "*.js" -print0 | xargs -0 -n1 node --check
